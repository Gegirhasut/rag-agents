name: rag-agents-test

# Хранилища для integration-тестов: tmpfs, отдельные порты, не пересекаются с dev-стендом.
services:
  postgres-test:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: rag_test
      POSTGRES_USER: rag_test
      POSTGRES_PASSWORD: rag_test  # только для эфемерной тестовой БД на tmpfs
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_test -d rag_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  redis-test:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 64m

  qdrant-test:
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    tmpfs:
      - /qdrant/storage
    ports:
      - "127.0.0.1:16333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m
