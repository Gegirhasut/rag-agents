[project]
name = "rag-agents"
version = "0.1.0"
description = "RAG agents over document corpora: FastAPI + HTMX, Celery ingest, Qdrant, DeepSeek"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "tokenizers>=0.20",
    "charset-normalizer>=3.3",
    "structlog>=24.4",
    "markdown-it-py>=3.0",
    "nh3>=0.2.18",
    "typer>=0.12",
    "uuid-utils>=0.9",
    "anyio>=4.4",
    "numpy>=2.0",
    "langfuse>=4.15",
    "pyyaml>=6.0",
    "pwdlib[argon2]>=0.2",
    "lxml>=5.3",
    "selectolax>=0.3.21",
    "razdel>=0.5",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "import-linter>=2.1",
    "celery-types>=0.22",
    "types-pyyaml>=6.0.12.20260906",
    "lxml-stubs>=0.5",
]

[project.scripts]
rag-agents = "rag_agents.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF", "PL", "PT", "TRY", "DTZ"]
ignore = [
    "PLR0913", "PLR0917",  # DI-конструкторы сервисов и роуты FastAPI принимают много зависимостей
    "TRY003",   # короткие сообщения в исключениях допустимы
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях — норма для проекта
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"scripts/**" = ["S101", "T201", "PLR2004", "S311", "PLR0912", "PLR0915"]  # линейные сценарии
"migrations/**" = ["E501"]
"tests/fixtures/**" = ["E501"]  # цитаты из книги для фикстур

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["rag_agents"]

[[tool.mypy.overrides]]
# PyMuPDF без аннотаций: вызовы его API в этом модуле нетипизированы
module = ["rag_agents.rag.parsing.pdf"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["nh3.*", "markdown_it.*", "razdel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: needs compose.test.yaml services (postgres, qdrant)",
    "e2e: runs against the live stack",
]

[tool.importlinter]
root_package = "rag_agents"

[[tool.importlinter.contracts]]
name = "Web/API do not touch storage or RAG internals directly"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["rag_agents.web", "rag_agents.api"]
forbidden_modules = ["rag_agents.repositories", "rag_agents.models", "rag_agents.rag", "rag_agents.llm"]

[[tool.importlinter.contracts]]
name = "RAG and LLM layers do not depend on services or web"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["rag_agents.rag", "rag_agents.llm"]
forbidden_modules = ["rag_agents.services", "rag_agents.web", "rag_agents.workers", "rag_agents.repositories"]

[[tool.importlinter.contracts]]
name = "Workers only call services"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["rag_agents.workers"]
forbidden_modules = ["rag_agents.web", "rag_agents.repositories", "rag_agents.rag"]

[[tool.importlinter.contracts]]
name = "Eval goes through services like any client"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["rag_agents.eval"]
forbidden_modules = ["rag_agents.web", "rag_agents.api", "rag_agents.workers", "rag_agents.repositories", "rag_agents.models"]
